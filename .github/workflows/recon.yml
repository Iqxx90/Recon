name: 1 - Reconnaissance

on:
  workflow_dispatch:

jobs:
  recon-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Network Diagnostics Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils jq curl

      - name: Restore Previous Asset History
        uses: actions/cache/restore@v4
        id: cache-history
        with:
          path: old_assets.txt
          key: asset-history-v1

      - name: Fetch and Filter Subdomains
        env:
          TARGET: "rockstargames.com"
        run: |
          echo "🔄 Pulling SSL Certificate Transparency logs..."
          curl -s "https://crt.sh" | \
          jq -r '.[].name_value' | \
          tr '[:upper:]' '[:lower:]' | \
          sed 's/\*\.//g' | \
          sort -u > raw_subs.txt

          echo "🔍 Verifying active live assets..."
          touch verified_subs.txt
          while IFS= read -r sub; do
            if [[ "$sub" == *"$TARGET" ]] && [[ ! "$sub" =~ [[:space:]] ]]; then
              if dig +short "$sub" | grep -q '^[0-9]'; then
                echo "$sub" >> verified_subs.txt
              fi
            fi
          done < raw_subs.txt

          sort -u verified_subs.txt -o current_assets.txt

      - name: Detect New Assets Only
        run: |
          touch old_assets.txt
          comm -23 current_assets.txt old_assets.txt > new_assets.txt
          NEW_COUNT=$(wc -l < new_assets.txt)
          echo "NEW_ASSETS_FOUND=$NEW_COUNT" >> $GITHUB_ENV
          echo "Found $NEW_COUNT brand new subdomains."

      # New Step: Check web server status codes for new discoveries
      - name: Analyze HTTP Status Codes
        if: env.NEW_ASSETS_FOUND > 0
        run: |
          echo "📡 Scanning HTTP/HTTPS endpoints for new targets..."
          touch live_report.txt
          
          # Check up to the top 10 new subdomains to protect execution limits
          head -n 10 new_assets.txt | while IFS= read -r sub; do
            # Request the headers, follow redirects (--location), timeout after 3 seconds
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --connect-timeout 3 --location "https://$sub" || echo "DEAD")
            
            # If HTTPS fails, fallback and try standard HTTP
            if [ "$STATUS" = "000" ] || [ "$STATUS" = "DEAD" ]; then
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" --connect-timeout 3 --location "http://$sub" || echo "DOWN")
            fi
            
            echo "• $sub [$STATUS]" >> live_report.txt
          done

      - name: Notify Discord Channel
        if: env.NEW_ASSETS_FOUND > 0
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COUNT=${{ env.NEW_ASSETS_FOUND }}
          # Read the formatted list from live_report.txt
          LIST=$(cat live_report.txt | tr '\n' '\\n')
          
          PAYLOAD=$(jq -n \
            --arg c "⚠️ **New Infrastructure Detected for rockstargames.com!**\n🔥 Found **$COUNT** brand-new live subdomains.\n\n📋 **HTTP Service Status:**\n\`\`\`text\n$LIST\n\`\`\`" \
            '{content: $c}')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               $WEBHOOK_URL

      - name: Update Asset History Cache File
        run: cp current_assets.txt old_assets.txt

      - name: Save Updated Cache to GitHub Cloud
        uses: actions/cache/save@v4
        if: always()
        with:
          path: old_assets.txt
          key: asset-history-v1
