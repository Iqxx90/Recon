name: 2 - Security Scan

on:
  workflow_run:
    workflows: ["1 - Reconnaissance"]
    types:
      - completed

jobs:
  nuclei-scan:
    # Run only if the recon workflow completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Download the "rockstar-live-assets" file generated by Workflow 1
      - name: Download Recon Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "rockstar-live-assets"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync('${{ github.workspace }}/rockstar-live-assets.zip', Buffer.from(download.data));

      - name: Unzip Target File
        run: |
          unzip rockstar-live-assets.zip
          echo "Targets ready for vulnerability scanning:"
          cat final_assets.txt

      # 2. Install and run Nuclei Vulnerability Scanner
      - name: Run Nuclei Vulnerability Scan
        id: nuclei_scan
        uses: projectdiscovery/nuclei-action@v1.1.30
        with:
          urls: final_assets.txt
          templates: cves/,exposures/,misconfiguration/,vulnerabilities/
          output: nuclei_results.txt

      # 3. Read scan results and send a direct payload to Discord
      - name: Report Flaws to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -s nuclei_results.txt ]; then
            # Clean up text lines for JSON formatting
            VULNS=$(head -n 15 nuclei_results.txt | tr '\n' '\\n')
            PAYLOAD=$(jq -n --arg c "🚨 **Vulnerability Scan Results for rockstargames.com**\n❌ **Critical Issues Found!**\n\`\`\`text\n$VULNS\n\`\`\`" '{content: $c}')
          else
            PAYLOAD=$(jq -n --arg c "🛡️ **Vulnerability Scan Results for rockstargames.com**\n✅ Scan finished. No critical vulnerabilities detected on verified targets." '{content: $c}')
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               $WEBHOOK_URL
